[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "passkeytransit"
version = "0.1.0"
description = "Reproducible research harness for passkey migration semantics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=45,<51",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[project.scripts]
passkeytransit = "passkeytransit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

