name: Open provider replay

on:
  workflow_dispatch:
  push:
    branches:
      - codex/usenix27-pdf
    paths:
      - .github/workflows/provider-replays.yml
      - src/passkeytransit/fenko_provider.py
      - src/passkeytransit/fenko_roundtrip.py
      - tools/run_proton_cxf_prf.py
      - tools/verify_proton_public_report.py
      - interop/proton-cxf-prf/package-lock.json
      - interop/proton-cxf-prf/run.mjs
      - experiments/protocol_v2.json
      - experiments/protocol_v2_fenko_roundtrip.json
      - experiments/protocol_v2_proton_software.json

permissions:
  contents: read

jobs:
  fenko-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install project and Chromium
        run: |
          python -m pip install -e .
          python -m playwright install --with-deps chromium
      - name: Fetch pinned Fenko source and build extension
        run: |
          git init tmp/vendor_fenko
          git -C tmp/vendor_fenko remote add origin https://github.com/FenkoHQ/passkey-vault.git
          git -C tmp/vendor_fenko fetch --depth=1 origin 2d873fbe25257250de6e322e9d785b97b17a544f
          git -C tmp/vendor_fenko checkout --detach FETCH_HEAD
          test "$(git -C tmp/vendor_fenko rev-parse HEAD)" = 2d873fbe25257250de6e322e9d785b97b17a544f
          cd tmp/vendor_fenko
          npm ci --ignore-scripts --no-audit --no-fund
          npm test -- --runInBand tests/porting/cxf.test.ts
          npm run typecheck
          npm run build:chrome
      - name: Replay Fenko CXF import and browser assertions
        run: |
          BROWSER_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          mkdir -p tmp/provider-ci
          python -m passkeytransit fenko-provider --protocol experiments/protocol_v2.json --vendor-root tmp/vendor_fenko --browser "$BROWSER_PATH" --output tmp/provider-ci/fenko_provider.json
          python -m passkeytransit verify-fenko-provider --report tmp/provider-ci/fenko_provider.json --protocol experiments/protocol_v2.json
          python -m passkeytransit fenko-roundtrip --protocol experiments/protocol_v2_fenko_roundtrip.json --vendor-root tmp/vendor_fenko --browser "$BROWSER_PATH" --output tmp/provider-ci/fenko_roundtrip.json
          python -m passkeytransit verify-fenko-roundtrip --report tmp/provider-ci/fenko_roundtrip.json --protocol experiments/protocol_v2_fenko_roundtrip.json
          sha256sum tmp/provider-ci/*.json
      - uses: actions/upload-artifact@v4
        with:
          name: fenko-browser-replays
          path: tmp/provider-ci/*.json
          retention-days: 14

  proton-software:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned dependencies
        run: |
          python -m pip install -e .
          cd interop/proton-cxf-prf
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Replay Proton software CXF and PRF
        run: |
          mkdir -p tmp/provider-ci
          python tools/run_proton_cxf_prf.py --node "$(command -v node)" --adapter interop/proton-cxf-prf/run.mjs --output tmp/provider-ci/proton_cxf_prf.json
          python tools/verify_proton_public_report.py --report tmp/provider-ci/proton_cxf_prf.json
          sha256sum tmp/provider-ci/proton_cxf_prf.json
      - uses: actions/upload-artifact@v4
        with:
          name: proton-software-replay
          path: tmp/provider-ci/proton_cxf_prf.json
          retention-days: 14
