name: USENIX 2027 paper PDF

on:
  workflow_dispatch:
  push:
    branches:
      - codex/usenix27-pdf
    paths:
      - .github/workflows/usenix27-pdf.yml
      - paper/venues/usenixsecurity27/official_pdf/**

permissions:
  contents: read

jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify the unmodified USENIX style
        run: cmp paper/venues/usenixsecurity27/official_pdf/usenix.sty paper/venues/usenixsecurity27/template/usenix.sty
      - name: Compile with the unmodified USENIX style
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4
        with:
          root_file: main.tex
          working_directory: paper/venues/usenixsecurity27/official_pdf
          texlive_version: 2026
      - name: Inspect the compiled PDF
        working-directory: paper/venues/usenixsecurity27/official_pdf
        run: |
          file main.pdf
          sha256sum main.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: usenix27-pdf
          path: paper/venues/usenixsecurity27/official_pdf/main.pdf
          retention-days: 7
