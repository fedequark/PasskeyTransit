name: Open CXP exporter replay

on:
  workflow_dispatch:
  push:
    branches:
      - codex/usenix27-pdf
    paths:
      - .github/workflows/cxporter-cxp-open.yml
      - interop/cxporter_cxp_probe/main.go
      - tools/run_cxporter_cxp_passkey.py
      - tools/verify_cxporter_cxp_public_report.py
      - interop/cxp_poc2_cross_probe/pt-cross.ts
      - tools/run_cxp_poc2_cross.py
      - tools/verify_cxp_poc2_cross_report.py
      - interop/cxp_poc2_cross_probe/pt-vector.ts
      - tools/run_cxp_public_vector.py
      - tools/verify_cxp_public_vector.py
      - experiments/cxporter_cxp_open/vectors/**
      - interop/cxp_poc2_cross_probe/pt-index-control.ts
      - tools/extract_cxp_public_index.py
      - tools/run_cxp_index_control.py
      - tools/verify_cxp_index_control.py
      - interop/cxp_poc2_cross_probe/pt-rp-control.ts
      - tools/run_cxp_poc2_rp_control.py
      - tools/verify_cxp_poc2_rp_control.py
      - interop/cxp_poc2_cross_probe/pt-adapter-rp.ts
      - tools/cxporter_to_poc2_rp_adapter.py
      - tools/run_cxporter_poc2_adapter_rp.py
      - tools/verify_cxporter_poc2_adapter_rp.py

permissions:
  contents: read

jobs:
  cxporter-passkey:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOEXPERIMENT: runtimesecret
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.0'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project and pinned authenticator
        run: |
          python -m pip install -e .
          cd interop/proton-cxf-prf
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Fetch pinned cxporter and test its exporter
        run: |
          git init tmp/vendor_cxporter
          git -C tmp/vendor_cxporter remote add origin https://github.com/nvinuesa/cxporter.git
          git -C tmp/vendor_cxporter fetch --depth=1 origin 96bab31fdadcfd295542bba86b8ec8bd2355294a
          git -C tmp/vendor_cxporter checkout --detach FETCH_HEAD
          test "$(git -C tmp/vendor_cxporter rev-parse HEAD)" = 96bab31fdadcfd295542bba86b8ec8bd2355294a
          (cd tmp/vendor_cxporter && go test ./internal/cxp)
          mkdir -p tmp/vendor_cxporter/cmd/passkeytransit-probe
          cp interop/cxporter_cxp_probe/main.go tmp/vendor_cxporter/cmd/passkeytransit-probe/main.go
          (cd tmp/vendor_cxporter && go build -o ../cxporter-passkey-probe ./cmd/passkeytransit-probe)
      - name: Replay encrypted export and verify public evidence
        run: |
          mkdir -p tmp/cxporter-ci
          python tools/run_cxporter_cxp_passkey.py --binary tmp/cxporter-passkey-probe --node "$(command -v node)" --authenticator interop/proton-cxf-prf/run.mjs --output tmp/cxporter-ci/report.json
          python tools/verify_cxporter_cxp_public_report.py --report tmp/cxporter-ci/report.json
          sha256sum tmp/cxporter-ci/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: cxporter-cxp-open-report
          path: tmp/cxporter-ci/report.json
          retention-days: 14
      - name: Fetch pinned second open importer
        run: |
          git init tmp/vendor_cxp_poc2
          git -C tmp/vendor_cxp_poc2 remote add origin https://github.com/ShaminAkarsha/cxp_poc2.git
          git -C tmp/vendor_cxp_poc2 fetch --depth=1 origin fee19d9ac392ffe0153bea8b917aa0a66f12b272
          git -C tmp/vendor_cxp_poc2 checkout --detach FETCH_HEAD
          test "$(git -C tmp/vendor_cxp_poc2 rev-parse HEAD)" = fee19d9ac392ffe0153bea8b917aa0a66f12b272
          npm install -g pnpm@11.25.0
          (cd tmp/vendor_cxp_poc2 && pnpm install --frozen-lockfile --ignore-scripts)
      - name: Replay cross-implementation rejection
        run: |
          python tools/run_cxp_poc2_cross.py --binary tmp/cxporter-passkey-probe --go-source tmp/vendor_cxporter --ts-source tmp/vendor_cxp_poc2 --output tmp/cxporter-ci/cross_import_rejection.json
          (cd tmp/vendor_cxp_poc2 && pnpm typecheck)
          python tools/verify_cxp_poc2_cross_report.py --report tmp/cxporter-ci/cross_import_rejection.json
          sha256sum tmp/cxporter-ci/cross_import_rejection.json
      - uses: actions/upload-artifact@v4
        with:
          name: cxporter-poc2-cross-report
          path: tmp/cxporter-ci/cross_import_rejection.json
          retention-days: 14
      - name: Replay retained public ciphertext vector
        run: |
          python tools/verify_cxp_public_vector.py
          python tools/run_cxp_public_vector.py --ts-source tmp/vendor_cxp_poc2 --vector experiments/cxporter_cxp_open/vectors/cxporter-poc2-v1.json > tmp/cxporter-ci/public_vector_replay.json
          python tools/run_cxp_public_vector.py --binary tmp/cxporter-passkey-probe --ts-source tmp/vendor_cxp_poc2 --vector tmp/cxporter-ci/fresh_vector.json > tmp/cxporter-ci/fresh_vector_replay.json
          (cd tmp/vendor_cxp_poc2 && pnpm typecheck)
      - uses: actions/upload-artifact@v4
        with:
          name: cxporter-poc2-public-vector-replay
          path: |
            tmp/cxporter-ci/public_vector_replay.json
            tmp/cxporter-ci/fresh_vector_replay.json
          retention-days: 14
      - name: Isolate decrypted index-layout gate
        run: |
          python tools/extract_cxp_public_index.py --output tmp/cxporter-ci/index-rederived.json
          python tools/run_cxp_index_control.py --ts-source tmp/vendor_cxp_poc2 --output tmp/cxporter-ci/index_control.json
          python tools/verify_cxp_index_control.py --report tmp/cxporter-ci/index_control.json
          (cd tmp/vendor_cxp_poc2 && pnpm typecheck)
      - uses: actions/upload-artifact@v4
        with:
          name: cxporter-poc2-index-layout-control
          path: tmp/cxporter-ci/index_control.json
          retention-days: 14
      - name: Exercise pinned PoC migration and local RP
        run: |
          python tools/run_cxp_poc2_rp_control.py --ts-source tmp/vendor_cxp_poc2 --output tmp/cxporter-ci/poc2_rp_control.json
          python tools/verify_cxp_poc2_rp_control.py --report tmp/cxporter-ci/poc2_rp_control.json
          (cd tmp/vendor_cxp_poc2 && pnpm typecheck)
      - uses: actions/upload-artifact@v4
        with:
          name: cxp-poc2-rp-control
          path: tmp/cxporter-ci/poc2_rp_control.json
          retention-days: 14
      - name: Exercise cxporter ciphertext through project adapter at PoC RP
        run: |
          python tools/run_cxporter_poc2_adapter_rp.py --binary tmp/cxporter-passkey-probe --go-source tmp/vendor_cxporter --ts-source tmp/vendor_cxp_poc2 --output tmp/cxporter-ci/adapter_rp_control.json
          python tools/verify_cxporter_poc2_adapter_rp.py --report tmp/cxporter-ci/adapter_rp_control.json
          (cd tmp/vendor_cxp_poc2 && pnpm typecheck)
      - uses: actions/upload-artifact@v4
        with:
          name: cxporter-poc2-adapter-rp-control
          path: tmp/cxporter-ci/adapter_rp_control.json
          retention-days: 14
