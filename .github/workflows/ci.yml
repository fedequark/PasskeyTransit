name: research-verification

on:
  push:
  pull_request:

jobs:
  python-verification:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: ./research.ps1 setup
      - run: ./research.ps1 test
      - run: ./research.ps1 protocol
      - run: ./research.ps1 requirements
      - run: ./research.ps1 cxp-requirements
      - run: .venv/Scripts/python.exe tools/compare_cxp_type_parsers.py
      - run: .venv/Scripts/python.exe tools/verify_cxp_zip_jwe_reports.py
      - run: .venv/Scripts/python.exe tools/verify_proton_cxp_wire_reports.py
      - run: ./research.ps1 phase7-calibration

  external-cxf:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - run: pwsh ./research.ps1 setup
      - run: pwsh ./research.ps1 phase11
      - uses: actions/setup-go@v6
        with:
          go-version-file: interop/jose_hpke_go/go.mod
          cache-dependency-path: interop/jose_hpke_go/go.sum
      - name: Verify external JOSE HPKE crypto interoperability
        env:
          GOEXPERIMENT: jsonv2
          GOTOOLCHAIN: local
        run: |
          mkdir -p tmp
          cd interop/jose_hpke_go
          go build -o ../../tmp/jose-hpke-go .
          cd ../..
          .venv/bin/python tools/run_jose_hpke_go_interop.py tmp/jose-hpke-go "$(command -v go)" tmp/jose-hpke-ci.json
          .venv/bin/python tools/verify_jose_hpke_go_interop.py
          .venv/bin/python tools/run_cxp_jose_zip_go.py tmp/jose-hpke-go "$(command -v go)" tmp/cxp-jose-zip-ci.json
          .venv/bin/python tools/verify_cxp_jose_zip_go.py
